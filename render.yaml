services:
  - type: web
    name: naaravali-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /tmp/naaravali.db
      - key: CORS_ORIGINS
        value: https://naaravali-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: HF_INFERENCE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
  - type: web
    name: naaravali-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://naaravali-api.onrender.com/api
